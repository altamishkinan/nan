
name: Build VeyrionID Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR with Maven
        working-directory: VeyrionID
        run: mvn -B clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeyrionID-Plugin
          path: VeyrionID/target/*.jar
          if-no-files-found: error
          retention-days: 30
